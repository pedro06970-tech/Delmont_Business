services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: delmont-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - delmont-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delmont-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Delmont Business}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-delmont}:${POSTGRES_PASSWORD:-delmont}@postgres:5432/${POSTGRES_DB:-delmont}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - delmont-network

  postgres:
    image: postgres:16-alpine
    container_name: delmont-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delmont}
      POSTGRES_USER: ${POSTGRES_USER:-delmont}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delmont}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delmont} -d ${POSTGRES_DB:-delmont}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delmont-network

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delmont_test
      POSTGRES_USER: delmont_test
      POSTGRES_PASSWORD: delmont_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delmont_test -d delmont_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - delmont-network
    profiles: ["test"]

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://delmont_test:delmont_test@postgres-test:5432/delmont_test
      FRONTEND_ORIGIN: http://localhost:3000
      PYTHONPATH: /app
      SESSION_TTL_MINUTES: 60
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_WINDOW_MINUTES: 15
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
    command: pytest -q -p no:cacheprovider
    networks:
      - delmont-network
    profiles: ["test"]

networks:
  delmont-network:
    driver: bridge

volumes:
  postgres_data:
